{% extends 'base.html' %}
{% block content %}
<div class="container">
    <h2>Confirm Deletion</h2>
    <p>Are you sure you want to delete this fee structure?</p>
    <p><strong>{{ fee.category.name }}</strong> - {{ fee.amount }} (Term {{ fee.term }})</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        <a href="{% url 'fees:fee_structure_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
